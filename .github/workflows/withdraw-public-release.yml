name: Withdraw public release

on:
  push:
    branches: [maintenance/withdraw-public-release-20261113]
    paths: [.github/workflows/withdraw-public-release.yml]

permissions:
  contents: write
  actions: write

jobs:
  withdraw:
    if: github.repository == 'cymx333/HGhub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Withdraw v1.2.19 from public downloads
        run: |
          set -euo pipefail
          gh release edit v1.2.19 --repo "$GITHUB_REPOSITORY" --draft=true
          state="$(gh release view v1.2.19 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$state" = true
          echo 'Release v1.2.19 is now a private draft.'
      - name: Disable the public Windows publishing workflow
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/windows-release.yml/disable"
      - name: Remove the matching public build artifact
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/13953750232"
          echo 'Removed the Windows release artifact from the public repository.'
